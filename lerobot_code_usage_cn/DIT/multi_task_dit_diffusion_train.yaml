dataset:
  repo_id: arx_v30_297
  root: /media/wu/data/SUN_ht/datasets/arx_v30_297
  return_uint8: true

policy:
  type: multi_task_dit
  repo_id: wu/multi-task-dit-arx-bimanual
  device: cuda
  use_amp: true
  push_to_hub: false

  objective: diffusion
  noise_scheduler_type: DDPM
  num_train_timesteps: 100
  num_inference_steps: 20
  beta_schedule: squaredcos_cap_v2
  prediction_type: epsilon
  clip_sample: true
  clip_sample_range: 1.0

  n_obs_steps: 2
  horizon: 32
  n_action_steps: 24

  hidden_dim: 384
  num_layers: 6
  num_heads: 6
  dropout: 0.1
  use_rope: true
  use_positional_encoding: false

  vision_encoder_name: openai/clip-vit-base-patch16
  text_encoder_name: openai/clip-vit-base-patch16
  tokenizer_max_length: 77
  image_crop_shape: [224, 224]
  image_crop_is_random: true
  use_separate_rgb_encoder_per_camera: false
  vision_encoder_lr_multiplier: 0.01

  normalization_mapping:
    VISUAL: MEAN_STD
    STATE: MIN_MAX
    ACTION: MIN_MAX

output_dir: /media/wu/data/SUN_ht/dit/runs/multi_task_dit_diffusion_arx
job_name: multi_task_dit_diffusion_arx

batch_size: 32
steps: 60000
save_freq: 2000
log_freq: 20
num_workers: 4
eval_freq: 0

wandb:
  enable: false
