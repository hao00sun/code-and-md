dataset:
  repo_id: arx_0724_1553
  root: /data/SUN_ht/datasets/arx_0724_1553
policy:
  type: pi05
  repo_id: wu/pi05_arx_0724_1553_freeze_left_ga1
  pretrained_path: /data/SUN_ht/pi/pretrained_weights/pi05_base
  compile_model: false
  gradient_checkpointing: true
  dtype: bfloat16
  freeze_vision_encoder: false
  train_expert_only: false
  device: cuda
  # Freeze left arm during training: only right-arm dims participate in action loss.
  action_loss_active_arms: right
  action_loss_active_dims: [7, 8, 9, 10, 11, 12, 13]
  normalization_mapping:
    ACTION: MEAN_STD
    STATE: MEAN_STD
    VISUAL: IDENTITY
  push_to_hub: false

output_dir: /mnt/bigdata/SUN_ht/runs/pi05_arx_0724_1553_freeze_left_ga1_{timestamp}
log_dir: /data/SUN_ht/pi/logs/pi05_arx_0724_1553_freeze_left_ga1_{timestamp}
job_name: pi05_arx_0724_1553_freeze_left_ga1
batch_size: 16
gradient_accumulation_steps: 1
steps: 12000
save_freq: 2000
log_freq: 20
num_workers: 4

wandb:
  enable: false
